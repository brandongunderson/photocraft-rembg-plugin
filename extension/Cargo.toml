[package]
name = "photocraft-plugin-rembg"
version = "1.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
description = "Independent Rembg Background Removal panel for PhotoCraft"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
