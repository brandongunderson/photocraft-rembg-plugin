[package]
name = "photocraft-rembg-plugin"
version = "1.2.1"
edition = "2024"
license = "MIT"
publish = false
description = "Self-contained rembg background removal plugin supervisor"

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10.9"
crc32fast = "1.5.2"
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }

[[bin]]
name = "photocraft-rembg-worker"
path = "src/worker.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
